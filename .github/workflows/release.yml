name: Build and release Questlio
on:
  push:
    branches: [main]
    paths: [desktop/**, installer/**, .github/workflows/release.yml, RELEASE-NOTES.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: questlio-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build self-contained Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=[regex]::Match((Get-Content desktop/AppInfo.cs -Raw),'Version="([0-9.]+)"').Groups[1].Value
          if(-not $version){throw 'Version missing'}
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish desktop/Questlio.csproj -c Release -r win-x64 --self-contained true -o dist/app
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          Get-ChildItem dist/app -Filter '*.pdb' | Remove-Item
          if(-not(Test-Path dist/app/ui/react-glass.js)){throw 'Glass bundle missing'}
      - name: Check native core with synthetic data
        shell: pwsh
        run: |
          $env:GAIDEN_CHECK_OUTPUT=Join-Path $env:RUNNER_TEMP 'Questlio-core-checks'
          $p=Start-Process -FilePath ./dist/app/Questlio.exe -ArgumentList '--test-features','--text-results' -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw "Native checks failed: $($p.ExitCode)"}
      - name: Build Setup with integrated uninstaller
        shell: pwsh
        run: |
          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if(-not(Test-Path -LiteralPath $iscc)){
            choco install innosetup --yes --no-progress
            if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}
          }
          & $iscc ('/DAppVersion='+$env:APP_VERSION) ('/DPublishDir='+((Resolve-Path dist/app).Path)) ('/DOutputDir='+((Resolve-Path dist).Path)) installer/Questlio.iss
          if($LASTEXITCODE -ne 0){throw 'Setup compilation failed'}
      - name: Verify install, upgrade and uninstall preserve data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'Questlio-install-check'
          $data=Join-Path $env:LOCALAPPDATA 'Questlio'
          New-Item -ItemType Directory -Force $data | Out-Null
          $sentinel=Join-Path $data 'release-test-preserve.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve-library'
          $setup=(Resolve-Path "dist/Questlio-$env:APP_VERSION-Setup.exe").Path
          foreach($pass in 1..2){
            $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',('/DIR="'+$target+'"')) -Wait -PassThru -WindowStyle Hidden
            if($p.ExitCode -ne 0){throw "Setup failed: $($p.ExitCode)"}
            foreach($file in 'Questlio.exe','ui/react-glass.js','unins000.exe'){
              if(-not(Test-Path -LiteralPath (Join-Path $target $file))){throw "Installed file missing: $file"}
            }
          }
          $p=Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw "Uninstall failed: $($p.ExitCode)"}
          if(Test-Path -LiteralPath (Join-Path $target 'Questlio.exe')){throw 'App was not removed'}
          if((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'preserve-library'){throw 'User data changed'}
      - name: Package portable and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/app/* -DestinationPath "dist/Questlio-$env:APP_VERSION-win-x64-portable.zip" -CompressionLevel Optimal
          $files=Get-ChildItem dist -File | Where-Object Extension -in '.exe','.zip'
          $files | ForEach-Object { $hash=Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Questlio-${{ env.APP_VERSION }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v'+$env:APP_VERSION
          gh release view $tag *> $null
          if($LASTEXITCODE -eq 0){throw "Release $tag already exists; refusing to replace a published build"}
          gh release create $tag --target $env:GITHUB_SHA --title "Questlio $env:APP_VERSION — Liquid Glass + Setup" --notes-file RELEASE-NOTES.md "dist/Questlio-$env:APP_VERSION-Setup.exe" "dist/Questlio-$env:APP_VERSION-win-x64-portable.zip" dist/SHA256SUMS.txt
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
